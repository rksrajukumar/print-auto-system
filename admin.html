<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Auto Print Server Admin</title><style>body{font-family:Arial;margin:0;background:#f4f7fb;color:#172033}.top{background:#0e2d68;color:white;padding:18px;font-size:24px;font-weight:700}.wrap{padding:22px;max-width:1300px;margin:auto}.card{background:#fff;border-radius:14px;padding:18px;margin-bottom:18px;box-shadow:0 2px 10px #0001}input{padding:10px;border:1px solid #bbb;border-radius:8px;margin:5px}button{padding:10px 15px;border:0;border-radius:8px;background:#168642;color:#fff;cursor:pointer}table{width:100%;border-collapse:collapse}th,td{padding:10px;border-bottom:1px solid #ddd;text-align:left}.online{color:green}.off{color:red}.muted{color:#777}</style></head><body><div class="top">AUTO PRINT SERVER — Admin Panel</div><div class="wrap"><div class="card"><h2>Default Payment</h2><input id="key" placeholder="Admin Key" type="password"><button onclick="load()">Load</button><pre id="pay"></pre></div><div class="card"><h2>Add Client</h2><input id="name" placeholder="Client name"><input id="cid" placeholder="Client ID e.g. PC001"><input id="upi" placeholder="Client UPI ID (optional)"><input id="num" placeholder="Client UPI number (optional)"><button onclick="add()">Create Client</button><pre id="new"></pre></div><div class="card"><h2>Clients</h2><table><thead><tr><th>ID</th><th>Name</th><th>Status</th><th>UPI</th><th>Upload</th><th>QR</th></tr></thead><tbody id="rows"></tbody></table></div></div><script>let K='';async function api(u,o={}){o.headers=Object.assign({'x-admin-key':K,'content-type':'application/json'},o.headers||{});return fetch(u,o)}async function load(){K=key.value;const r=await api('/api/admin/payment');pay.textContent=JSON.stringify(await r.json(),null,2);refresh()}async function refresh(){const r=await api('/api/admin/clients');const a=await r.json();rows.innerHTML=a.map(c=>`<tr><td>${c.id}</td><td>${c.name}</td><td class="${c.online?'online':'off'}">${c.online?'Online':'Offline'}</td><td>${c.payment.upi_id||c.payment.upi_number||'<span class="muted">Default</span>'}</td><td><a href="${c.upload_url}" target="_blank">Open</a></td><td><a href="/api/qr/client/${c.id}" target="_blank">QR</a></td></tr>`).join('')}async function add(){const r=await api('/api/admin/client',{method:'POST',body:JSON.stringify({id:cid.value,name:name.value,upi_id:upi.value,upi_number:num.value})});new.textContent=JSON.stringify(await r.json(),null,2);refresh()}</script></body></html>
