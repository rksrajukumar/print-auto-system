<!doctype html><meta charset=utf-8><meta name=viewport content="width=device-width,initial-scale=1">
<title>Auto Print Server</title><style>
body{font-family:Arial;margin:0;background:#f4f7fb;color:#17202a}header{background:#05283d;color:#fff;padding:18px 24px;font-size:20px;font-weight:bold}.wrap{padding:20px;max-width:1200px;margin:auto}.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}.card{background:#fff;border:1px solid #dbe3e9;border-radius:10px;padding:18px;margin-bottom:16px}input,button,select{padding:9px;border-radius:6px;border:1px solid #c8d2da}button{background:#087b43;color:white;border:0;cursor:pointer}.danger{background:#c62828}.row{padding:10px 0;border-bottom:1px solid #eee}.qr{width:180px}@media(max-width:800px){.grid{grid-template-columns:1fr}}
</style><header>☁ AUTO PRINT SERVER — Admin Panel</header><div class=wrap>
<div class=grid><div class=card><h2>Default Payment</h2><input id=upi placeholder="UPI ID"><br><br><input id=num placeholder="UPI Number"><br><br><input id=base type=number placeholder="Base Amount"><br><br><input id=bw type=number placeholder="B/W per page"><br><br><input id=col type=number placeholder="Colour per page"><br><br><input id=min type=number placeholder="Minimum Amount"><br><br><button onclick=saveSettings()>Save Settings</button></div>
<div class=card><h2>Add Client PC</h2><input id=name placeholder="Client / Shop Name"><br><br><input id=pc placeholder="PC ID e.g. PC001"><br><br><input id=cupi placeholder="Client UPI ID (optional)"><br><br><input id=cnum placeholder="Client UPI Number (optional)"><br><br><button onclick=addClient()>Create Client</button><p id=secret></p></div></div>
<div class=card><h2>Clients / PCs</h2><div id=clients></div></div><div class=card><h2>Jobs / Queue</h2><div id=jobs></div></div></div>
<script>
const $=id=>document.getElementById(id);async function api(u,o){let r=await fetch(u,o);return r.json()}
async function load(){let s=await api('/api/admin/settings');$('upi').value=s.upiId;$('num').value=s.upiNumber;$('base').value=s.baseAmount;$('bw').value=s.bwPerPage;$('col').value=s.colourPerPage;$('min').value=s.minAmount;
let cs=await api('/api/admin/clients');$('clients').innerHTML=cs.map(c=>`<div class=row><b>${c.name}</b> — ${c.pcId} — ${c.online?'🟢 Online':'🔴 Offline'}<br><small>UPI: ${c.upiId||'Default'} | ${c.enabled?'Enabled':'Disabled'}</small><br><button onclick="link('${c.pcId}')">Upload QR / Link</button> <button onclick="edit('${c.id}','${c.upiId||''}','${c.upiNumber||''}')">Set Payment</button> <button class=danger onclick="del('${c.id}')">Delete</button></div>`).join('')||'No clients';
let js=await api('/api/admin/jobs');$('jobs').innerHTML=js.map(j=>`<div class=row>${j.originalName} — ${j.pcId} — ₹${j.amount} — <b>${j.status}</b></div>`).join('')||'No jobs'}
async function saveSettings(){await api('/api/admin/settings',{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({upiId:$('upi').value,upiNumber:$('num').value,baseAmount:+$('base').value,bwPerPage:+$('bw').value,colourPerPage:+$('col').value,minAmount:+$('min').value})});load()}
async function addClient(){let x=await api('/api/admin/clients',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name:$('name').value,pcId:$('pc').value,upiId:$('cupi').value,upiNumber:$('cnum').value})});$('secret').textContent=x.secret?'Client secret: '+x.secret:'Error: '+x.error;load()}
async function link(pc){let x=await api('/api/public/'+pc+'/upload-link');let w=window.open();w.document.write('<h3>Upload Link</h3><p>'+x.link+'</p><img src="'+x.qr+'">')}
async function edit(id,upiId,upiNumber){let u=prompt('Client UPI ID (blank = default)',upiId),n=prompt('Client UPI Number (blank = default)',upiNumber);if(u===null)return;await api('/api/admin/clients/'+id,{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({upiId:u,upiNumber:n})});load()}
async function del(id){if(confirm('Delete client?')){await api('/api/admin/clients/'+id,{method:'DELETE'});load()}} load();
</script>
