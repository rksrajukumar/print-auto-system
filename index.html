<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Auto Print Admin</title>
<style>body{font-family:Arial;margin:0;background:#f3f6fa;color:#162234}.top{background:#073b66;color:#fff;padding:18px 24px;font-size:22px;font-weight:bold}.wrap{padding:20px}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:14px}.card,.panel{background:#fff;border:1px solid #dde5ef;border-radius:12px;padding:18px}.n{font-size:30px;font-weight:bold;margin-top:8px}button{padding:10px 14px;border:0;border-radius:8px;background:#0b6b45;color:#fff;margin:8px 6px 8px 0}table{width:100%;border-collapse:collapse}th,td{padding:9px;border-bottom:1px solid #e5e9ef;text-align:left}.on{color:#078245;font-weight:bold}.off{color:#c62828;font-weight:bold}</style></head>
<body><div class="top">🖨️ AUTO PRINT SERVER — ADMIN</div><div class="wrap"><div><button onclick="load()">Dashboard</button><button onclick="loadClients()">Clients / PCs</button><button onclick="loadJobs()">Jobs / Queue</button></div>
<div class="cards"><div class="card">Total Clients<div id="tc" class="n">0</div></div><div class="card">Online<div id="ac" class="n">0</div></div><div class="card">Total Jobs<div id="tj" class="n">0</div></div><div class="card">Pending<div id="pj" class="n">0</div></div></div>
<div class="panel" style="margin-top:16px"><h2>Clients / PCs</h2><div id="clients">Loading...</div></div><div class="panel" style="margin-top:16px"><h2>Jobs / Queue</h2><div id="jobs">Loading...</div></div></div>
<script>
async function get(u){return(await fetch(u)).json()}
async function load(){let s=await get('/api/admin/stats');tc.textContent=s.totalClients;ac.textContent=s.activeClients;tj.textContent=s.totalJobs;pj.textContent=s.pendingJobs;loadClients();loadJobs()}
async function loadClients(){let x=await get('/api/admin/clients');clients.innerHTML='<table><tr><th>Client ID</th><th>PC</th><th>Printer</th><th>Status</th><th>Upload</th></tr>'+x.clients.map(c=>`<tr><td>${c.client_id}</td><td>${c.pc_name||'-'}</td><td>${c.printer_name||'-'}</td><td class="${c.status==='online'?'on':'off'}">${c.status}</td><td><a href="/upload/${c.client_id}">Open</a></td></tr>`).join('')+'</table>'}
async function loadJobs(){let x=await get('/api/admin/jobs');jobs.innerHTML='<table><tr><th>Job</th><th>Client</th><th>File</th><th>Payment</th><th>Status</th></tr>'+x.jobs.map(j=>`<tr><td>${j.job_id}</td><td>${j.client_id}</td><td>${j.file_name}</td><td>${j.payment_status}</td><td>${j.job_status}</td></tr>`).join('')+'</table>'}
load();setInterval(load,10000)
</script></body></html>
