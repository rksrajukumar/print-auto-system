<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Auto Print Upload</title>
<style>body{font-family:Arial,sans-serif;background:#07111f;color:#eef5ff;margin:0;min-height:100vh;display:grid;place-items:center}.card{width:min(560px,92vw);background:#0d1928;border:1px solid #263a52;border-radius:18px;padding:24px;box-shadow:0 20px 60px #0008}.muted{color:#9db0c6;font-size:14px}.online{color:#4fe58a}.offline{color:#ff7373}label{display:block;margin-top:15px;font-size:14px;color:#cbd8e6}input,select{width:100%;box-sizing:border-box;margin-top:7px;padding:12px;border-radius:8px;border:1px solid #30445b;background:#091523;color:#fff}button{width:100%;margin-top:20px;padding:13px;border:0;border-radius:9px;background:#1678e9;color:#fff;font-size:16px;font-weight:700}button:disabled{opacity:.55}.msg{margin-top:15px;padding:12px;border-radius:8px;background:#12263b;display:none}.title{font-size:24px;font-weight:700}.sub{margin-top:5px}.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}@media(max-width:500px){.row{grid-template-columns:1fr}}</style></head><body><div class="card"><div class="title">📄 Auto Print</div><div id="pc" class="sub muted">Loading printer...</div><div class="muted" style="margin-top:12px">Upload your document and submit. The job will be placed directly in this PC's print queue.</div>
<form id="f"><label>Document<input id="file" type="file" required accept=".pdf,.doc,.docx,.jpg,.jpeg,.png,.txt"></label><div class="row"><div><label>Print Type<select id="type"><option value="BW">Black & White</option><option value="COLOR">Color</option></select></label></div><div><label>Paper Size<select id="paper"><option>A4</option><option>A3</option></select></label></div></div><label>Copies<input id="copies" type="number" min="1" max="100" value="1"></label><button id="btn">Upload & Print</button></form><div id="msg" class="msg"></div></div>
<script>
const id=location.pathname.split('/').filter(Boolean).pop(); const $=x=>document.getElementById(x); let online=false;
async function init(){try{const r=await fetch('/api/v1/public/client/'+encodeURIComponent(id));const d=await r.json();if(!d.ok)throw Error('Client not found');online=d.online;$('pc').innerHTML='PC: <b>'+esc(d.deviceName||id)+'</b> · <span class="'+(online?'online':'offline')+'">'+(online?'Online':'Offline')+'</span>';}catch(e){$('pc').textContent='This client link is invalid or unavailable.';$('btn').disabled=true}}
function esc(s){return String(s).replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}
$('f').addEventListener('submit',async e=>{e.preventDefault();const file=$('file').files[0];if(!file)return; if(file.size>20*1024*1024){show('File is larger than 20 MB.',true);return} $('btn').disabled=true;$('btn').textContent='Uploading...';try{const b64=await new Promise((resolve,reject)=>{const r=new FileReader();r.onload=()=>resolve(String(r.result).split(',')[1]);r.onerror=reject;r.readAsDataURL(file)});const r=await fetch('/api/v1/public/client/'+encodeURIComponent(id)+'/upload',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({fileName:file.name,fileBase64:b64,printType:$('type').value,paperSize:$('paper').value,copies:Number($('copies').value)||1})});const d=await r.json();if(!d.ok)throw Error(d.error||'Upload failed');show('✓ Document uploaded successfully. Print job '+d.jobId+' is now in the client queue.',false);$('f').reset();$('copies').value=1}catch(e){show('Upload failed: '+e.message,true)}finally{$('btn').disabled=false;$('btn').textContent='Upload & Print'}});
function show(t,err){$('msg').style.display='block';$('msg').textContent=t;$('msg').style.border='1px solid '+(err?'#a33':'#245b3b')}
init();
</script></body></html>
