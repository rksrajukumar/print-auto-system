<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Auto Print Upload</title>
<style>body{font-family:Arial;background:#f5f7fa;margin:0;padding:25px}.box{max-width:560px;margin:auto;background:#fff;padding:24px;border-radius:14px;box-shadow:0 5px 25px #0001}input,select,button{width:100%;padding:12px;margin:8px 0;box-sizing:border-box}button{cursor:pointer;background:#111;color:#fff;border:0;border-radius:8px}.muted{color:#667085}.ok{padding:12px;background:#eaf8ef;border-radius:8px;margin-top:12px}</style></head><body><div class="box"><h2>Auto Print</h2><div id="client" class="muted">Loading…</div><form id="f"><input type="file" name="file" accept=".pdf,.jpg,.jpeg,.png" required><select name="printType"><option value="BW">B/W</option><option value="COLOR">Colour</option></select><input name="copies" type="number" min="1" max="100" value="1"><button>Submit Print Job</button></form><div id="out"></div></div><script>
const id=location.pathname.split("/").pop();fetch("/api/v1/public/client/"+id).then(r=>r.json()).then(x=>document.getElementById("client").textContent=(x.client?.client_name||x.client?.pc_name||"Print Client")+" • "+(x.client?.printer_name||"Default printer"));
f.onsubmit=async e=>{e.preventDefault();let r=await fetch("/api/v1/public/upload/"+id,{method:"POST",body:new FormData(f)}),j=await r.json();out.innerHTML=r.ok?`<div class="ok">Job ID: <b>${j.job_id}</b><br>Status: ${j.status}</div>`:`<div>${j.error||"Upload failed"}</div>`};
</script></body></html>
