<!doctype html><meta name=viewport content="width=device-width,initial-scale=1"><title>Auto Print Upload</title>
<style>body{font-family:Arial;background:#f5f7fb;padding:20px}.box{max-width:520px;margin:auto;background:white;padding:22px;border-radius:12px}.box>*{width:100%;margin:7px 0;padding:10px;box-sizing:border-box}button{background:#087b43;color:#fff;border:0;border-radius:7px;font-weight:bold}</style>
<div class=box><h2>AUTO PRINT</h2><div id=info>Loading…</div><input id=file type=file accept=".pdf,.jpg,.jpeg,.png"><select id=type><option value=bw>B/W</option><option value=colour>Colour</option></select><select id=paper><option>A4</option><option>A3</option></select><input id=copies type=number min=1 value=1><button onclick=submitJob()>Continue</button><div id=msg></div></div>
<script>
const pc=new URLSearchParams(location.search).get('pc');let cfg;
async function init(){cfg=await (await fetch('/api/public/'+encodeURIComponent(pc)+'/config')).json();info.innerHTML='<b>'+cfg.client.name+'</b><br>UPI: '+cfg.payment.upiId+'<br>UPI Number: '+cfg.payment.upiNumber}
async function submitJob(){if(!file.files[0])return msg.textContent='Choose a file';let fd=new FormData();fd.append('file',file.files[0]);fd.append('printType',type.value);fd.append('paper',paper.value);fd.append('copies',copies.value);fd.append('pages','1');let r=await fetch('/api/public/'+encodeURIComponent(pc)+'/job',{method:'POST',body:fd}),x=await r.json();if(!r.ok)return msg.textContent=x.error;msg.innerHTML='<h3>Amount ₹'+x.amount+'</h3><p>Pay using UPI ID: <b>'+x.upiId+'</b><br>UPI Number: <b>'+x.upiNumber+'</b></p><p>Payment verification is not used. After payment, tap the button below.</p><button onclick="paymentDone('+x.jobId+')">Payment Done / Send for Printing</button>';}
async function paymentDone(id){let r=await fetch('/api/public/job/'+id+'/payment-done',{method:'POST'}),x=await r.json();msg.innerHTML=x.ok?'<h3>✓ Job sent for printing</h3><p>Your file has been sent to the selected PC.</p>':'Error: '+(x.error||'Failed')}
init();
</script>
