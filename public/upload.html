<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Auto Print</title><style>body{font-family:Arial,sans-serif;background:#0b1016;color:#fff;margin:0}.wrap{max-width:620px;margin:30px auto;padding:18px}.card{background:#121b25;border:1px solid #26384a;border-radius:14px;padding:20px;margin-bottom:14px}h1{margin-top:0}.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}label{display:block;margin:10px 0 6px;color:#a9b8c8}input,select,button,a.pay{width:100%;box-sizing:border-box;padding:12px;border-radius:8px;border:1px solid #35506b;background:#0e1620;color:#fff}button,a.pay{cursor:pointer;background:#155b86;border:0;font-weight:700;text-decoration:none;display:block;text-align:center}.muted{color:#9aabba;font-size:13px}.amount{font-size:28px;font-weight:800}.qr{max-width:240px;max-height:240px;display:block;margin:12px auto;background:#fff;padding:8px;border-radius:8px}.ok{color:#69e28b}.bad{color:#ff7272}.hidden{display:none}.step{font-weight:700;margin-bottom:10px}.paybox{display:grid;gap:10px}</style></head><body><div class="wrap"><div class="card"><h1>Auto Print</h1><div id="client" class="muted">Loading shop...</div></div><div class="card"><div class="step">1. Document & Print Options</div><input id="file" type="file" accept=".pdf,.jpg,.jpeg,.png,.doc,.docx"><div class="row"><div><label>Print Type</label><select id="type"><option value="BW">B/W</option><option value="COLOR">Color</option></select></div><div><label>Paper Size</label><select id="size"><option value="A4">A4</option><option value="A3">A3</option></select></div></div><label>Copies</label><input id="copies" type="number" min="1" max="100" value="1"><div style="margin-top:14px"><button onclick="upload()">UPLOAD &amp; CALCULATE AMOUNT</button></div><div id="uploadMsg" class="muted" style="margin-top:10px"></div></div><div id="payment" class="card hidden"><div class="step">2. UPI Payment</div><div>Total Amount: <span id="amount" class="amount">₹0</span></div><div id="upi" class="paybox"></div><img id="qr" class="qr hidden"><div id="payStatus" class="muted">Pay using the UPI QR or UPI ID above.</div><button id="payNow" class="hidden" style="margin-top:10px" onclick="openUpi()">PAY NOW</button><button id="paid" class="hidden" style="margin-top:10px" onclick="iHavePaid()">I HAVE PAID</button><div id="payMsg" class="muted" style="margin-top:10px"></div></div><div id="print" class="card hidden"><div class="step">3. Print</div><div id="verifyMsg" class="ok">Payment marked as paid.</div><button style="margin-top:12px" onclick="printNow()">PRINT NOW</button><div id="printMsg" class="muted" style="margin-top:10px"></div></div></div><script>const cid=decodeURIComponent(location.pathname.split('/').filter(Boolean).pop());let jobId='',upiLink='';const $=id=>document.getElementById(id);function esc(x){return String(x).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}async function getClient(){const r=await fetch('/api/v1/public/client/'+encodeURIComponent(cid));const d=await r.json();if(!d.ok){$('client').textContent='Client not found';return}$('client').textContent=(d.deviceName||cid)+(d.online?' • Online':' • Offline');if(d.upiId){$('upi').innerHTML='<div>UPI ID: <b>'+esc(d.upiId)+'</b></div><button onclick="navigator.clipboard&&navigator.clipboard.writeText('+JSON.stringify(d.upiId)+')">COPY UPI ID</button>'}else $('upi').innerHTML='<div class="muted">UPI ID not configured.</div>';if(d.upiQr){$('qr').src=d.upiQr;$('qr').classList.remove('hidden')}}async function upload(){const f=$('file').files[0];if(!f){$('uploadMsg').textContent='Select a document first.';return}const reader=new FileReader();reader.onload=async()=>{const b64=String(reader.result).split(',')[1];const body={fileName:f.name,fileBase64:b64,printType:$('type').value,paperSize:$('size').value,copies:Number($('copies').value||1)};const r=await fetch('/api/v1/public/client/'+encodeURIComponent(cid)+'/upload',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});const d=await r.json();if(!d.ok){$('uploadMsg').textContent=d.error||'Upload failed';return}jobId=d.jobId;upiLink=d.upiLink||'';$('amount').textContent='₹'+Number(d.amount||0).toFixed(2);$('payment').classList.remove('hidden');$('uploadMsg').textContent='Document uploaded. Complete UPI payment.';if(upiLink)$('payNow').classList.remove('hidden');else $('payMsg').textContent='Use the QR/UPI ID above to pay.'};reader.readAsDataURL(f)}function openUpi(){if(upiLink){location.href=upiLink;setTimeout(()=>{$('paid').classList.remove('hidden');},1500)}}document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'&&jobId)$('paid').classList.remove('hidden')});async function iHavePaid(){const r=await fetch('/api/v1/public/job/'+jobId+'/i-have-paid',{method:'POST',headers:{'Content-Type':'application/json'}});const d=await r.json();if(d.ok){$('paid').classList.add('hidden');$('print').classList.remove('hidden');$('payMsg').textContent='Payment marked. PRINT NOW is available.'}}async function printNow(){const r=await fetch('/api/v1/public/job/'+jobId+'/print-now',{method:'POST'});const d=await r.json();$('printMsg').textContent=d.ok?'Print job sent to the shop computer queue.':'Unable to authorize printing.'}getClient();</script></body></html>
