<!doctype html><meta charset=utf-8><meta name=viewport content="width=device-width,initial-scale=1">
<title>Auto Print — Customer</title>
<style>
body{font-family:Arial;background:#f5f7fb;padding:15px}.box{max-width:560px;margin:auto;background:#fff;padding:22px;border-radius:14px;box-shadow:0 2px 15px #ddd}
.box>*{width:100%;margin:7px 0;padding:11px;box-sizing:border-box}button{background:#087b43;color:#fff;border:0;border-radius:7px;font-weight:bold}
.lock{background:#fff3cd;padding:12px;border-radius:8px}.ok{background:#d1e7dd;padding:12px;border-radius:8px}
</style>
<div class=box><h2>AUTO PRINT</h2><div id=info>Loading…</div>
<input id=file type=file accept=".pdf,.jpg,.jpeg,.png">
<select id=type><option value=bw>B/W</option><option value=colour>Color</option></select>
<select id=paper><option>A4</option><option>A3</option></select>
<input id=copies type=number min=1 value=1 placeholder="Copies">
<input id=pages type=number min=1 value=1 placeholder="Pages">
<div id=total></div><button onclick=submitJob()>Continue to Payment</button><div id=pay></div><div id=msg></div></div>
<script>
const client=new URLSearchParams(location.search).get('client');let cfg,jobId;
const $=id=>document.getElementById(id);
async function api(u,o){let r=await fetch(u,o);return [r,r.json()]}
async function init(){let r=await fetch('/api/public/'+encodeURIComponent(client)+'/config');cfg=await r.json();
 if(!r.ok){info.textContent=cfg.error;return}
 info.innerHTML='<b>'+cfg.client.shopName+'</b><br>Client ID: '+cfg.client.clientId+'<br>UPI: '+cfg.payment.upiId;
 [type,paper,copies,pages].forEach(x=>x.addEventListener('change',calc));calc()}
function calc(){if(!cfg)return;let per=type.value==='colour'?+cfg.rates.colourPerPage:+cfg.rates.bwPerPage;let a=Math.max(+cfg.rates.minAmount,+cfg.rates.baseAmount+(+pages.value||1)*(+copies.value||1)*per);total.innerHTML='<b>Total: ₹'+a+'</b>'}
async function submitJob(){
 if(!file.files[0])return msg.textContent='Choose a document first';
 let fd=new FormData();fd.append('file',file.files[0]);fd.append('printType',type.value);fd.append('paper',paper.value);fd.append('copies',copies.value);fd.append('pages',pages.value);
 let r=await fetch('/api/public/'+encodeURIComponent(client)+'/job',{method:'POST',body:fd}),x=await r.json();if(!r.ok)return msg.textContent=x.error;
 jobId=x.jobId;
 pay.innerHTML='<div class=lock><h3>Step 5 — UPI Payment</h3><p>Pay <b>₹'+x.amount+'</b></p><p>UPI ID: <b>'+x.upiId+'</b><br>UPI Number: <b>'+x.upiNumber+'</b></p>'+(x.paymentQr?'<img src="'+x.paymentQr+'" style="max-width:230px">':'')+
 '<p>Payment verification is disabled. After completing UPI payment, press PRINT NOW.</p></div><button onclick=printNow()>PRINT NOW</button>';
}
async function printNow(){
 let r=await fetch('/api/public/job/'+jobId+'/print-now',{method:'POST'}),x=await r.json();
 msg.textContent=r.ok?'✓ Sent to shop print queue.':'✕ '+x.error;
}
init();
</script>
