<!doctype html><meta charset=utf-8><meta name=viewport content="width=device-width,initial-scale=1">
<title>Auto Print Server Admin</title>
<style>
body{font-family:Arial;margin:0;background:#f4f7fb;color:#17202a}header{background:#05283d;color:#fff;padding:18px 24px;font-size:20px;font-weight:bold}
.wrap{padding:20px;max-width:1200px;margin:auto}.card{background:#fff;border:1px solid #dbe3e9;border-radius:10px;padding:18px;margin-bottom:16px}
input,button{padding:10px;border-radius:6px;border:1px solid #c8d2da;margin:4px}button{background:#087b43;color:white;border:0;cursor:pointer}.row{padding:12px 0;border-bottom:1px solid #eee}
</style><header>☁ AUTO PRINT SERVER — ADMIN</header><div class=wrap>
<div class=card><h2>Payment / Rates</h2>
<input id=upi placeholder="Default UPI ID"><input id=num placeholder="UPI Number"><br>
<input id=base type=number placeholder="Base"><input id=bw type=number placeholder="B/W/page"><input id=col type=number placeholder="Color/page"><input id=min type=number placeholder="Minimum"><br>
<button onclick=saveSettings()>Save</button></div>
<div class=card><h2>Registered Shop PCs</h2><p>Client ID is generated automatically by the server when the client application installs/registers.</p><div id=clients>Loading…</div></div>
<div class=card><h2>Jobs</h2><div id=jobs>Loading…</div></div></div>
<script>
const $=x=>document.getElementById(x);
async function api(u,o){let r=await fetch(u,o);return r.json()}
async function load(){
 let s=await api('/api/admin/settings');upi.value=s.upiId;num.value=s.upiNumber;base.value=s.baseAmount;bw.value=s.bwPerPage;col.value=s.colourPerPage;min.value=s.minAmount;
 let cs=await api('/api/admin/clients');
 clients.innerHTML=cs.map(c=>`<div class=row><b>${c.name}</b> — <code>${c.clientId}</code> — ${c.online?'🟢 Online':'🔴 Offline'}<br>
 <small>${location.origin}/upload.html?client=${encodeURIComponent(c.clientId)}</small><br>
 <button onclick="qr('${c.clientId}')">Customer QR</button>
 <button onclick="payment('${c.id}','${c.upiId||''}','${c.upiNumber||''}')">Payment</button></div>`).join('')||'No clients';
 let js=await api('/api/admin/jobs');jobs.innerHTML=js.map(j=>`<div class=row>${j.originalName} — ${j.clientId} — ₹${j.amount} — <b>${j.status}</b></div>`).join('')||'No jobs';
}
async function saveSettings(){await api('/api/admin/settings',{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({upiId:upi.value,upiNumber:num.value,baseAmount:+base.value,bwPerPage:+bw.value,colourPerPage:+col.value,minAmount:+min.value})});load()}
async function qr(id){let x=await api('/api/public/'+id+'/qr');let w=window.open();w.document.write('<h2>Customer QR</h2><p>'+x.link+'</p><img src="'+x.qr+'" style="width:350px">')}
async function payment(id,u,n){let a=prompt('Client UPI ID (blank = default)',u);if(a===null)return;let b=prompt('Client UPI Number (blank = default)',n);if(b===null)return;await api('/api/admin/clients/'+id,{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({upiId:a,upiNumber:b})});load()}
load();setInterval(load,10000);
</script>
