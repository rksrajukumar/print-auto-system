<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Auto Print</title><style>body{font-family:Arial;background:#f3faf6}.box{max-width:560px;margin:30px auto;background:#fff;padding:24px;border-radius:16px;box-shadow:0 4px 18px #0001}label{display:block;margin:12px 0 6px;font-weight:bold}input,select{width:100%;padding:12px;box-sizing:border-box;border:1px solid #bbb;border-radius:8px}button{width:100%;padding:14px;margin-top:18px;background:#0b6b45;color:#fff;border:0;border-radius:8px}</style></head><body><div class="box"><h1>🖨️ Auto Print</h1><p>PDF / JPG / PNG — max 5 MB</p><form id="f"><label>File</label><input name="file" type="file" accept=".pdf,.jpg,.jpeg,.png" required><label>Print Type</label><select name="print_type"><option>BW</option><option>COLOUR</option></select><label>Paper</label><select name="paper_size"><option>A4</option><option>A5</option></select><label>Copies</label><input name="copies" type="number" min="1" max="100" value="1"><label>Amount</label><input name="amount" type="number" step="0.01" value="10"><button>Payment Done / Submit Print</button></form><p id="m"></p></div><script>const id=location.pathname.split('/').filter(Boolean).pop();f.onsubmit=async e=>{e.preventDefault();let r=await fetch('/api/upload/'+id,{method:'POST',body:new FormData(f)}),x=await r.json();m.textContent=x.ok?'Print job created: '+x.job_id:'Error: '+x.error}</script></body></html>
