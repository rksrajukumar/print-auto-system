<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Auto Print Admin</title><style>body{font-family:Arial,sans-serif;background:#f4f6f8;margin:0;color:#17202a}.wrap{max-width:1200px;margin:30px auto;padding:20px}.card{background:white;border-radius:14px;padding:18px;margin:12px 0;box-shadow:0 2px 10px #0000000d}input,button,select{padding:10px;margin:5px;border:1px solid #ccd3da;border-radius:8px}button{cursor:pointer}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}.stat b{font-size:28px}.ok{color:#15803d}.bad{color:#b91c1c}table{width:100%;border-collapse:collapse}td,th{padding:9px;border-bottom:1px solid #eee;text-align:left}small{color:#667085}</style></head><body><div class="wrap"><h1>Auto Print System</h1><div id="login" class="card"><h2>Admin Login</h2><input id="u" placeholder="Username"><input id="p" type="password" placeholder="Password"><button onclick="login()">Login</button><span id="le"></span></div><div id="app" style="display:none"><div class="grid" id="stats"></div><div class="card"><h2>Clients</h2><table><thead><tr><th>ID</th><th>PC</th><th>Printers</th><th>Status</th><th>Last seen</th></tr></thead><tbody id="clients"></tbody></table></div><div class="card"><h2>Create Print Job</h2><select id="client"></select><input id="printer" placeholder="Printer name (optional)"><input id="file" type="file"><button onclick="job()">Send Print Job</button><span id="je"></span></div><div class="card"><h2>Recent Jobs</h2><table><thead><tr><th>Job</th><th>Client</th><th>File</th><th>Status</th><th>Updated</th></tr></thead><tbody id="jobs"></tbody></table></div></div></div><script>let T=localStorage.apToken;const $=id=>document.getElementById(id);async function login(){let r=await fetch('/api/v1/admin/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:$('u').value,password:$('p').value})});let d=await r.json();if(!d.ok){$('le').textContent=' Login failed';return}localStorage.apToken=d.token;T=d.token;show()}function show(){$('login').style.display='none';$('app').style.display='block';load()}async function api(u,o={}){o.headers={...(o.headers||{}),Authorization:'Bearer '+T};let r=await fetch(u,o);if(r.status===401){localStorage.removeItem('apToken');location.reload()}return r.json()}async function load(){let d=await api('/api/v1/admin/overview');let s=d.stats;$('stats').innerHTML=[['Clients',s.clients],['Online',s.online],['Offline',s.offline],['Printers',s.printers],['Jobs',s.jobs],['Completed',s.completed],['Failed',s.failed]].map(x=>`<div class="card stat"><small>${x[0]}</small><br><b>${x[1]}</b></div>`).join('');$('clients').innerHTML=d.clients.map(c=>{let on=c.lastSeen&&(Date.now()-Date.parse(c.lastSeen)<90000);return `<tr><td>${c.id}</td><td>${c.deviceName}</td><td>${(c.printers||[]).join(', ')}</td><td class="${on?'ok':'bad'}">${on?'Online':'Offline'}</td><td>${c.lastSeen||'-'}</td></tr>`}).join('');$('client').innerHTML=d.clients.filter(c=>c.active).map(c=>`<option value="${c.id}">${c.deviceName} (${c.id})</option>`).join('');$('jobs').innerHTML=d.jobs.map(j=>`<tr><td>${j.id}</td><td>${j.clientId}</td><td>${j.fileName}</td><td>${j.status}</td><td>${j.updatedAt}</td></tr>`).join('')}async function job(){let f=$('file').files[0];if(!f)return $('je').textContent=' Select a file';if(f.size>20*1024*1024)return $('je').textContent=' File too large';let b=await new Promise((res,rej)=>{let r=new FileReader();r.onload=()=>res(r.result.split(',')[1]);r.onerror=rej;r.readAsDataURL(f)});let d=await api('/api/v1/admin/jobs',{method:'POST',headers:{'Content-Type':'application/json',Authorization:'Bearer '+T},body:JSON.stringify({clientId:$('client').value,printerName:$('printer').value,fileName:f.name,fileBase64:b})});$('je').textContent=d.ok?' Job queued':' '+(d.error||'failed');load()}if(T)show();</script></body></html>
