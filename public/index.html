<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Auto Print Dashboard</title><style>body{font-family:Arial;background:#111827;color:#eef2f7;margin:0}.wrap{max-width:1200px;margin:auto;padding:25px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:14px}.card{background:#1f2937;padding:18px;border-radius:12px}.btn{padding:10px 14px;border:0;border-radius:8px;cursor:pointer}.light{color:#aeb8c7}table{width:100%;border-collapse:collapse;margin-top:15px}td,th{padding:10px;border-bottom:1px solid #374151;text-align:left}input{padding:10px;margin:4px}</style></head><body><div class="wrap"><h1>Auto Print Dashboard</h1><p class="light">Server Online • Admin: <span id="who">admin</span></p><div class="grid"><div class="card">Total Clients<br><b id="tc">0</b></div><div class="card">Online Clients<br><b id="oc">0</b></div><div class="card">Total Jobs<br><b id="tj">0</b></div><div class="card">Completed<br><b id="done">0</b></div><div class="card">Failed<br><b id="fail">0</b></div></div><div class="card" style="margin-top:18px"><button class="btn" onclick="refresh()">Refresh</button> <button class="btn" onclick="changePassword()">Change Password</button> <button class="btn" onclick="payment()">Payment/UPI</button><h2>Registered Clients / PCs</h2><table><thead><tr><th>Client ID</th><th>PC</th><th>Printer</th><th>Status</th><th>Upload</th></tr></thead><tbody id="ct"></tbody></table></div><div class="card" style="margin-top:18px"><h2>Recent Jobs</h2><table><thead><tr><th>Job</th><th>Client</th><th>File</th><th>Status</th></tr></thead><tbody id="jt"></tbody></table></div></div><script>
let token=sessionStorage.token||"";async function login(){let u=prompt("Admin username","admin"),p=prompt("Admin password","Admin@12345");let r=await fetch("/api/v1/admin/login",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({username:u,password:p})}),j=await r.json();if(!r.ok)throw Error(j.error);token=j.token;sessionStorage.token=token}
async function api(u,o={}){o.headers={...(o.headers||{}),Authorization:"Bearer "+token};let r=await fetch(u,o);if(r.status===401){await login();o.headers.Authorization="Bearer "+token;r=await fetch(u,o)}return r.json()}
async function refresh(){let c=await api("/api/v1/admin/clients"),j=await api("/api/v1/admin/jobs");tc.textContent=c.clients.length;oc.textContent=c.clients.filter(x=>x.status==="online"&&!x.disabled).length;tj.textContent=j.jobs.length;done.textContent=j.jobs.filter(x=>x.status==="COMPLETED").length;fail.textContent=j.jobs.filter(x=>x.status==="FAILED").length;ct.innerHTML=c.clients.map(x=>`<tr><td>${x.client_id}</td><td>${x.pc_name||""}</td><td>${x.printer_name||""}</td><td>${x.status}</td><td><a target="_blank" href="/upload/${x.client_id}">Open</a></td></tr>`).join("");jt.innerHTML=j.jobs.slice(0,30).map(x=>`<tr><td>${x.job_id}</td><td>${x.client_id}</td><td>${x.original_name||""}</td><td>${x.status}</td></tr>`).join("")}
async function changePassword(){let a=prompt("Current password"),b=prompt("New password (8+ chars)");if(!b)return;let r=await api("/api/v1/admin/change-password",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({currentPassword:a,newPassword:b})});alert(r.ok?"Password changed":"Error: "+(r.error||"failed"))}
function payment(){location.href="/default-payment.html"} login().then(refresh).catch(e=>alert(e.message));
</script></body></html>
