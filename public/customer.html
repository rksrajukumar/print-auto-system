<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AUTO PRINT</title><style>body{font-family:Arial,sans-serif;background:#fff;margin:0;color:#333}.wrap{max-width:760px;margin:auto;padding:22px}.brand{text-align:center;color:#159447;font-size:42px;font-weight:700;margin:10px}.sub{text-align:center;color:#4aaf68;font-size:20px}.card{border:1px solid #ddd;border-radius:18px;padding:22px;margin-top:20px;box-shadow:0 3px 12px #0001}.label{font-size:20px;color:#249a4b;font-weight:700;margin:18px 0 8px}input,select{width:100%;box-sizing:border-box;padding:16px;border:2px solid #bbb;border-radius:12px;font-size:18px;background:#fafafa}button{width:100%;padding:17px;border:0;border-radius:12px;background:#111;color:#fff;font-size:20px;margin-top:22px}.hidden{display:none}.pay{background:#f5fff6;border:1px solid #a8d8b0}.upi{font-size:22px;font-weight:700}.qr{display:block;max-width:260px;margin:16px auto}.note{background:#fff9e8;border:1px solid #e8c45b;padding:14px;border-radius:10px;margin-top:15px}</style></head><body><div class="wrap"><div class="brand">🖨️ AUTO PRINT</div><div class="sub">PDF / JPG / PNG</div><div id="step1" class="card"><div class="label">📄 Document</div><input id="file" type="file" accept=".pdf,.jpg,.jpeg,.png"><div class="label">🖨️ Print Type</div><select id="print_type"><option>B/W</option><option>Colour</option></select><div class="label">📄 Paper</div><select id="paper"><option>A4</option><option>A3</option><option>A5</option><option>Letter</option></select><div class="label">📑 Copies</div><input id="copies" type="number" min="1" value="1"><button onclick="continuePay()">Continue</button></div><div id="step2" class="card pay hidden"><h2>🔒 Payment</h2><p>Make payment using the UPI details below. No payment confirmation is required.</p><h2 id="amount">Amount to Pay</h2><div class="upi" id="upi"></div><img id="qr" class="qr"><div class="note">After payment, submit the form below. The job will be sent automatically to the selected PC.</div><button onclick="submitJob()">I Have Paid & Continue</button><button style="background:#777" onclick="back()">Back to Edit</button></div></div><script>const cid=location.pathname.split('/').pop();let payment={};async function init(){const r=await fetch('/api/client/'+cid);if(!r.ok)return;const d=await r.json();payment=d.payment;document.getElementById('upi').textContent=(payment.upi_id||'')+(payment.upi_number?'  |  '+payment.upi_number:'');document.getElementById('qr').src='/api/qr/payment/'+cid}init();function continuePay(){if(!file.files[0])return alert('Please choose a document');step1.classList.add('hidden');step2.classList.remove('hidden')}function back(){step2.classList.add('hidden');step1.classList.remove('hidden')}async function submitJob(){const f=file.files[0],fd=new FormData();fd.append('document',f);fd.append('print_type',print_type.value);fd.append('paper',paper.value);fd.append('copies',copies.value);const r=await fetch('/api/upload/'+cid,{method:'POST',body:fd});const d=await r.json();if(!r.ok)return alert(d.error||'Upload failed');alert('Job created successfully. Please wait for printing.');location.reload()}</script></body></html>
