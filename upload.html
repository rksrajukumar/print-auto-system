<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Upload & Pay — Auto Print</title><style>
*{box-sizing:border-box}body{margin:0;font-family:Segoe UI,Arial,sans-serif;background:#f5f8fb;color:#172231}.top{background:#071d31;color:#fff;padding:18px 22px}.top b{font-size:17px}.wrap{max-width:760px;margin:28px auto;padding:0 16px}.card{background:#fff;border:1px solid #e1e7ee;border-radius:14px;padding:22px;box-shadow:0 8px 28px #10243a0b;margin-bottom:16px}.title h1{margin:0;font-size:24px}.muted{color:#6c7888;font-size:13px}.shop{margin-top:6px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.field{margin-top:14px}.field label{display:block;font-size:12px;font-weight:700;margin-bottom:7px}.field input,.field select{width:100%;padding:12px;border:1px solid #d7e0e9;border-radius:8px;background:#fff}.pay{display:flex;gap:20px;align-items:center}.pay img{width:190px;height:190px;border:1px solid #e0e6ed;border-radius:8px}.amount{font-size:27px;font-weight:800;margin:8px 0}.btn{width:100%;padding:13px;border:0;border-radius:9px;background:#0a9650;color:#fff;font-weight:700;cursor:pointer;margin-top:16px}.btn:disabled{opacity:.55}.notice{padding:11px;background:#eef7ff;border-radius:8px;font-size:12px;color:#315a8c;margin-top:14px}.success{padding:14px;background:#eaf8ef;border-radius:9px;color:#087a3f;font-size:13px}.error{padding:12px;background:#fff0f0;color:#b4232b;border-radius:9px;font-size:12px;margin-top:12px}@media(max-width:650px){.grid{grid-template-columns:1fr}.pay{flex-direction:column;align-items:flex-start}}
</style></head><body><div class="top"><b>🖨️ AUTO PRINT SERVER</b><div style="font-size:12px;margin-top:4px;opacity:.8">Secure Customer Upload & Payment</div></div><div class="wrap"><div class="card title"><h1>Upload Document</h1><div id="shop" class="muted shop">Loading client...</div></div><div id="formCard" class="card"><div class="grid"><div class="field"><label>Document</label><input id="file" type="file" accept=".pdf,.jpg,.jpeg,.png,.doc,.docx"></div><div class="field"><label>Copies</label><input id="copies" type="number" min="1" max="100" value="1" oninput="calc()"></div><div class="field"><label>Print Type</label><select id="printType" onchange="calc()"><option value="BW">B/W</option><option value="COLOR">Colour</option></select></div><div class="field"><label>Paper Size</label><select id="paperSize"><option>A4</option><option>A3</option></select></div></div><div class="notice">Maximum file size: 20 MB. Your document will be sent to the selected client PC print queue after upload.</div></div><div class="card"><h2 style="margin:0 0 5px;font-size:18px">Payment</h2><div id="payment" class="pay"><div><div class="muted">Amount to pay</div><div id="amount" class="amount">₹0.00</div><div id="upi" class="muted">Loading payment details...</div></div><img id="qr" alt="UPI Payment QR"></div><button id="submit" class="btn" onclick="submitJob()">Upload & Continue</button><div id="msg"></div></div></div><script>
const clientId=decodeURIComponent(location.pathname.split('/').pop());let cfg=null;function calc(){if(!cfg)return;let n=Math.max(1,Math.min(100,Number(document.getElementById('copies').value)||1));let rate=document.getElementById('printType').value==='COLOR'?Number(cfg.payment.colorRate):Number(cfg.payment.bwRate);let amount=Math.max(Number(cfg.payment.minimumAmount||0),Number(cfg.payment.baseAmount||0)+rate*n);document.getElementById('amount').textContent='₹'+amount.toFixed(2)}async function init(){try{let r=await fetch('/api/v1/public/client/'+encodeURIComponent(clientId));let j=await r.json();if(!r.ok)throw Error(j.error||'Client not found');cfg=j;document.getElementById('shop').textContent=(j.deviceName||'Client PC')+' • '+(j.online?'Online':'Offline');document.getElementById('upi').textContent=j.payment.upiId||j.payment.upiNumber||'Payment account not configured';if(j.payment.upiId)document.getElementById('qr').src='/api/v1/public/client/'+encodeURIComponent(clientId)+'/payment-qr.svg';calc()}catch(e){document.getElementById('msg').innerHTML='<div class="error">'+e.message+'</div>';document.getElementById('submit').disabled=true}}async function submitJob(){let f=document.getElementById('file').files[0];if(!f){document.getElementById('msg').innerHTML='<div class="error">Please select a document.</div>';return}if(f.size>20*1024*1024){document.getElementById('msg').innerHTML='<div class="error">File is larger than 20 MB.</div>';return}let reader=new FileReader();reader.onload=async()=>{try{let base64=String(reader.result).split(',')[1]||'';let copies=Math.max(1,Math.min(100,Number(document.getElementById('copies').value)||1));let body={fileName:f.name,fileBase64:base64,printType:document.getElementById('printType').value,paperSize:document.getElementById('paperSize').value,copies};let r=await fetch('/api/v1/public/client/'+encodeURIComponent(clientId)+'/upload',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});let j=await r.json();if(!r.ok)throw Error(j.error||'Upload failed');document.getElementById('formCard').style.display='none';document.getElementById('submit').disabled=true;document.getElementById('msg').innerHTML='<div class="success">Document uploaded successfully. Job ID: <b>'+j.jobId+'</b><br>Payment: '+(cfg.payment.upiId||cfg.payment.upiNumber||'Not configured')+'<br>Please complete payment using the QR shown above. The client PC will receive the print job automatically.</div>'}catch(e){document.getElementById('msg').innerHTML='<div class="error">'+e.message+'</div>'}};reader.readAsDataURL(f)}init();
</script></body></html>
